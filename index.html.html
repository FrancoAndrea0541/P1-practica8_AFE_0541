<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon Maqueta Básica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #e3e6e6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #131921;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #ff9900;
    }

    .search-box {
      display: flex;
      flex: 1;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 4px 0 0 4px;
      font-size: 14px;
      outline: none;
    }

    .search-box button {
      background-color: #febd69;
      border: none;
      padding: 8px 16px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-size: 15px;
    }

    nav {
      background-color: #232f3e;
      color: white;
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      font-size: 14px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .content {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background-color: white;
      padding: 15px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #0f1111;
    }

    .card-img {
      background-color: #f2f2f2;
      height: 140px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .card a {
      color: #007185;
      text-decoration: none;
      font-size: 13px;
      margin-top: auto;
    }

    .login-container {
      background-color: white;
      padding: 20px;
      border-radius: 4px;
      border: 1px solid #ddd;
      margin-bottom: 25px;
    }

    .login-container h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #0f1111;
    }

    .login-container form {
      font-size: 14px;
      color: #333;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
      padding: 5px;
      margin-top: 4px;
    }

    .login-container input[type="submit"],
    .login-container input[type="reset"] {
      padding: 5px 12px;
      cursor: pointer;
    }

    footer {
      background-color: #131921;
      height: 80px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">amazon</div>
    <div class="search-box">
      <input type="text" placeholder="Buscar en Amazon">
      <button type="button">🔍</button>
    </div>
  </header>

  <!-- Navigation -->
  <nav>
    <a href="#">Todo</a>
    <a href="#">Ofertas</a>
    <a href="#">Servicio al Cliente</a>
    <a href="#">Cupones</a>
  </nav>

  <!-- Main Content -->
  <div class="content">

    <!-- Product Cards -->
    <div class="grid-cards">
      <div class="card">
        <h3>Cocina</h3>
        <div class="card-img">Imagen Cocina</div>
        <a href="#">Ver más</a>
      </div>

      <div class="card">
        <h3>Belleza</h3>
        <div class="card-img">Imagen Belleza</div>
        <a href="#">Ver más</a>
      </div>

      <div class="card">
        <h3>Ropa</h3>
        <div class="card-img">Imagen Ropa</div>
        <a href="#">Ver más</a>
      </div>

      <div class="card">
        <h3>Laptops</h3>
        <div class="card-img">Imagen Laptop</div>
        <a href="#">Ver más</a>
      </div>
    </div>

    <!-- Login Form directly from PDF model -->
    <div class="login-container">
      <h2>Iniciar sesión</h2>
      <form action="" method="post">
        Ingresa tu usuario:
        <input type="text" name="usuario">
        <br><br>
        Ingresa tu contraseña:
        <input type="password" name="pass">
        <br><br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
      </form>
    </div>

  </div>

  <!-- Empty Footer -->
  <footer></footer>

</body>
</html>
