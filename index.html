<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amassssson pagina de prueba </title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #e3e6e6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #131921;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #ff9900;
    }


    nav {
      background-color: #232f3e;
      color: white;
      padding: 10px 20px;
      display: flex;
      gap: 20px;
      font-size: 14px;
    }


    .login-container {
      background-color: white;
      padding: 20px;
      border-radius: 4px;
      border: 1px solid #ddd;
      margin-bottom: 25px;
    }

    .login-container h2 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #0f1111;
    }

    .login-container form {
      font-size: 14px;
      color: #333;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
      padding: 5px;
      margin-top: 4px;
    }

    .login-container input[type="submit"],
    .login-container input[type="reset"] {
      padding: 5px 12px;
      cursor: pointer;
    }

    footer {
      background-color: #131921;
      height: 80px;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">amazon</div>
    </div>
  </header>

  
  <nav>
  </nav>
  
    <div class="login-container">
      <h2>Iniciar sesión</h2>
      <form action="" method="post">
        Ingresa tu usuario:
        <input type="text" name="usuario">
        <br><br>
        Ingresa tu contraseña:
        <input type="password" name="pass">
        <br><br>
        <input type="submit" value="enviar">
        <input type="reset" value="borrar">
      </form>
    </div>

  </div>

  
  <footer></footer>

</body>
</html>
